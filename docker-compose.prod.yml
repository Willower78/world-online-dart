version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_ENABLED=${REDIS_ENABLED}
      - REDIS_URL=${REDIS_URL}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PREMIUM_PRICE_ID=${STRIPE_PREMIUM_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    # No volumes for code, uses the built image
    restart: always
    depends_on:
      - mongo
      # - redis

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile.ai-backend
    ports:
      - "5001:5001"
    environment:
      - NODE_SERVER_URL=${NODE_SERVER_URL}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH}
    volumes:
      # We still keep models as a volume if you want to update it without rebuilding,
      # but ideally this should also be baked into the image for pure production.
      - ./ai-backend/models:/usr/src/app/models
    depends_on:
      - server
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"
  #   restart: always

volumes:
  mongo-data:
